<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Research Merge Orchestrator — Conversational interface with autonomous web research agents and structured synthesis." />
  <title>Research Merge Orchestrator — AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-wrapper">

    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">✦</div>
        <div class="brand-text">
          <h1 class="app-title">Research Merge Orchestrator</h1>
          <span class="app-subtitle">Multi-Agent Research Workflow</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- API Status Pill -->
        <div id="statusPill" class="status-pill checking" aria-live="polite" title="Backend service status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Checking API...</span>
        </div>

        <!-- Clear Chat Button -->
        <button id="clearBtn" class="btn btn-secondary" title="Clear conversation history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear</span>
        </button>
      </div>
    </header>

    <!-- ===== Chat Area ===== -->
    <section class="chat-panel" aria-label="Conversation window">
      <div class="chat-log" id="chatLog" role="log" aria-live="polite">
        <!-- Empty State Hero -->
        <div class="chat-empty" id="emptyState">
          <div class="empty-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h2>AI Research Orchestrator</h2>
          <p>Submit a query to trigger multi-agent web research. Sub-agents query relevant sources in parallel and synthesize an attributed report with scientific citations.</p>

          <div class="suggestions" id="suggestionsContainer">
            <span class="suggestions-title">Suggested research prompts:</span>
            <div class="suggestions-list">
              <button class="suggestion-chip" data-prompt="Analyze the latest and most relevant developments from NVIDIA in AI, including new chips and architectures, roadmap, partnerships, investments, and impact on the AI ecosystem.">
                <span>📰</span> Nvidia News        
              </button>
              <button class="suggestion-chip" data-prompt="Analyze the latest developments in open-weights AI models. Compare the most relevant models, their capabilities, licenses, benchmarks, costs, and key use cases. Highlight emerging trends and recent releases.">
                <span>🔬</span> Open Weights Models News
              </button>
              <button class="suggestion-chip" data-prompt="Analyze the latest developments in AI agents, including new frameworks and models, agentic capabilities, tool use, interoperability, enterprise use cases, and key players. Highlight the most relevant developments and emerging trends.">
                <span>⚡</span> AI Agent News
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Text Input Bar -->
      <div class="input-bar">
        <input
          type="text"
          id="textInput"
          class="text-input"
          placeholder="Ask a research question or enter a topic..."
          aria-label="Research prompt input"
          autocomplete="off"
        />
        <button id="sendBtn" class="btn btn-send" aria-label="Send message" title="Send (Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </section>

  </div>

  <script src="./app.js"></script>
</body>
</html>
